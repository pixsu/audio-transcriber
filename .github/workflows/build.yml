# Builds the Windows program on GitHub's free build servers.
#
# - Every push to main that changes the app: builds and tests it, and keeps
#   the zip under the run's "Artifacts" (Actions tab) for 30 days.
# - Pushing a version tag (e.g. v1.0.1): does the same, then publishes a
#   GitHub Release with the zip attached.
#
# To release: bump __version__ in transcriber.py, add a CHANGELOG.md entry,
# commit, then:  git tag v1.0.1  &&  git push origin v1.0.1

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - transcriber.py
      - requirements-lock.txt
      - build.bat
      - .github/workflows/build.yml
  workflow_dispatch:   # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write      # needed to create releases

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read version
        shell: pwsh
        run: |
          $m = Select-String -Path transcriber.py -Pattern '^__version__ = "(.+)"'
          $version = $m.Matches[0].Groups[1].Value
          "VERSION=$version" >> $env:GITHUB_ENV
          Write-Host "Version: $version"

      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          if ("${{ github.ref_name }}" -ne "v$env:VERSION") {
            Write-Error "Tag ${{ github.ref_name }} does not match __version__ = $env:VERSION in transcriber.py"
            exit 1
          }

      - name: Build
        shell: cmd
        run: build.bat < nul

      - name: Smoke test (transcribe a short test file with the built .exe)
        shell: pwsh
        run: |
          $app = "dist\AudioTranscriber"
          New-Item -ItemType Directory -Force smoke\in, smoke\out | Out-Null
          # 2 seconds of a 440 Hz tone as a WAV file
          python -c "import wave,struct,math; w=wave.open(r'smoke\in\tone.wav','wb'); w.setnchannels(1); w.setsampwidth(2); w.setframerate(16000); w.writeframes(b''.join(struct.pack('<h', int(8000*math.sin(2*math.pi*440*i/16000))) for i in range(32000))); w.close()"
          @{ input_folder = "$PWD\smoke\in"; output_folder = "$PWD\smoke\out"; model_size = "tiny" } |
            ConvertTo-Json | Set-Content -Encoding utf8 "$app\config.json"
          $p = Start-Process "$app\AudioTranscriber.exe" -WorkingDirectory $app -PassThru `
                 -RedirectStandardOutput smoke\stdout.txt -RedirectStandardError smoke\stderr.txt
          $deadline = (Get-Date).AddMinutes(10)
          while (-not (Test-Path smoke\out\tone.txt) -and -not $p.HasExited -and (Get-Date) -lt $deadline) {
            Start-Sleep 2
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Get-Content smoke\stdout.txt
          if (-not (Test-Path smoke\out\tone.txt)) {
            Get-Content smoke\stderr.txt
            Write-Error "Smoke test failed: the .exe did not produce a transcript"
            exit 1
          }
          Write-Host "Smoke test passed"

      - name: Name the zip
        shell: pwsh
        run: |
          $zip = "AudioTranscriber-$env:VERSION-windows-x64.zip"
          Copy-Item dist\AudioTranscriber.zip $zip
          "ZIP=$zip" >> $env:GITHUB_ENV

      - name: Upload build (Actions tab → this run → Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: AudioTranscriber-${{ env.VERSION }}-windows-x64
          path: ${{ env.ZIP }}
          retention-days: 30

      - name: Release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          # Take the text under "## [VERSION]" up to the next "## [" heading.
          $text = Get-Content CHANGELOG.md -Raw
          $pattern = "(?s)## \[$([regex]::Escape($env:VERSION))\][^\n]*\n(.*?)(?=\n## \[|\z)"
          $m = [regex]::Match($text, $pattern)
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "See CHANGELOG.md" }
          $notes += "`n`n### How to install`n1. Download **$env:ZIP** below.`n2. Unzip it and double-click ``AudioTranscriber.exe`` inside the folder.`n3. If Windows shows *Windows protected your PC*, click **More info → Run anyway**.`n`nSee the README for settings."
          Set-Content -Encoding utf8 release-notes.md $notes

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Audio Transcriber v${{ env.VERSION }}
          body_path: release-notes.md
          files: ${{ env.ZIP }}
